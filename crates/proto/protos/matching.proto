syntax = "proto3";

package exchange.matching;

service MatchingService {
  rpc PlaceOrder (PlaceOrderRequest) returns (PlaceOrderResponse);
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);
}

message PlaceOrderRequest {
  string order_id = 1;    // idempotency key for the order
  string user_id = 2;
  string market_id = 3;
  Side side = 4;
  OrderType order_type = 5;
  int64 price = 6;        // fixed precision, optional for market orders
  int64 quantity = 7;
  uint32 scale = 8;       // decimal scale
}

message PlaceOrderResponse {
  bool accepted = 1;
  repeated TradeExecuted trades = 2;
}

message CancelOrderRequest {
  string order_id = 1;
}

message CancelOrderResponse {
  bool success = 1;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  BUY = 1;
  SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  LIMIT = 1;
  MARKET = 2;
}

message TradeExecuted {
  string trade_id = 1;

  string buyer_id = 2;
  string seller_id = 3;

  string base_asset = 4;
  string quote_asset = 5;

  int64 base_amount = 6;
  int64 quote_amount = 7;
  uint32 scale = 8;
}
